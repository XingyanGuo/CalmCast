name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      # Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 修复旧参数
      - run: sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties || true

      # Android SDK
      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      # ✅ Gradle 8.2（关键最终解）
      - name: Download Gradle 8.2
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip

      # Build
      - name: Build APK
        run: ./gradle-8.2/bin/gradle assembleDebug --no-daemon

      # Upload
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
