name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      # --- Java 17 for SDK ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip tools.zip
          mv cmdline-tools latest

      - name: Setup PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      # --- Switch to Java 8 for build ---
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Fix JVM args
        run: sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties || true

      # ✅ Download old Gradle manually (关键)
      - name: Download Gradle 4.10.3
        run: |
          curl -L https://services.gradle.org/distributions/gradle-4.10.3-bin.zip -o gradle.zip
          unzip gradle.zip

      # ✅ Build
      - name: Build APK
        run: ./gradle-4.10.3/bin/gradle assembleDebug --no-daemon

      # Upload
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
