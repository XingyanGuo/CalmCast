name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Java 17（现代 Android + SDK 必须）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ✅ 修复旧 JVM 参数（避免崩）
      - name: Fix JVM args
        run: sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties || true

      # ✅ 安装 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ 安装必要 SDK 组件（可根据报错调整）
      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      # ✅ 下载稳定 Gradle 7.6（关键！）
      - name: Download Gradle 7.6
        run: |
          curl -L https://services.gradle.org/distributions/gradle-7.6-bin.zip -o gradle.zip
          unzip -q gradle.zip

      # ✅ Build APK
      - name: Build APK
        run: ./gradle-7.6/bin/gradle assembleDebug --no-daemon

      # ✅ 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
