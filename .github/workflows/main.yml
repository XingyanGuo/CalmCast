name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      # Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 修复旧参数
      - run: sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties || true

      # Android SDK
      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-33" "build-tools;33.0.2"

      # ✅ 关键：直接创建 gradlew（不用 gradle wrapper）
      - name: Create gradlew
        run: |
          curl -L https://raw.githubusercontent.com/gradle/gradle/v7.6/gradlew -o gradlew
          chmod +x gradlew

      - name: Create gradlew.bat
        run: |
          curl -L https://raw.githubusercontent.com/gradle/gradle/v7.6/gradlew.bat -o gradlew.bat

      # Build
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
