name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      # ✅ Java 8（旧项目必须）
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # 修复旧 JVM 参数
      - name: Fix JVM args
        run: sed -i 's/-XX:MaxPermSize=[^ ]*//g' gradle.properties || true

      # ✅ 手动安装 Android SDK（关键）
      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip tools.zip
          mv cmdline-tools latest

      # ✅ 配置 PATH（让 sdkmanager 可用）
      - name: Setup PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      # ✅ 安装 SDK 组件
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-28" "build-tools;28.0.3"

      # ✅ 旧 Gradle（关键）
      - name: Generate wrapper
        run: gradle wrapper --gradle-version 4.10.3

      # Build
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      # 上传 APK
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
